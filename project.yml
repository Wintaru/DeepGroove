name: DeepGroove

options:
  bundleIdPrefix: com.jdonner
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.4"
  generateEmptyDirectories: true
  createIntermediateGroups: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    SWIFT_STRICT_CONCURRENCY: targeted
    ENABLE_HARDENED_RUNTIME: YES

targets:
  DeepGrooveShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepGrooveShareExtension
        excludes:
          - "**/.DS_Store"
      # Shared with the DeepGroove app target so the extension can enqueue a
      # PendingWishlistItem/DiscogsSearchResult the main app decodes losslessly.
      - path: DeepGroove/Common/Contracts/PendingWishlistItem.swift
      - path: DeepGroove/Contracts/Discogs/DiscogsSearchResult.swift
      - path: DeepGroove/Common/Contracts/AppGroup.swift
      # Shared so the extension's Apple Music -> Discogs lookup runs through the same
      # SearchRecordHandler pipeline (search, ranking, artist-name correction) as the
      # in-app search, instead of a second hand-rolled implementation. None of these
      # touch SwiftData/@MainActor — see the "safe off main actor" list in CLAUDE.md.
      - path: DeepGroove/Common/Contracts/RequestBase.swift
      - path: DeepGroove/Common/Contracts/ResponseBase.swift
      - path: DeepGroove/Common/Resolver/IHandler.swift
      - path: DeepGroove/Common/Resolver/HandlerResolver.swift
      - path: DeepGroove/Common/Resolver/HandlerResolverBuilder.swift
      - path: DeepGroove/Common/Utilities/NetworkUtility.swift
      - path: DeepGroove/Common/Utilities/ImageUtility.swift
      - path: DeepGroove/Common/Utilities/StringUtility.swift
      - path: DeepGroove/Common/Utilities/KeychainUtility.swift
      - path: DeepGroove/Configuration/APIConfiguration.swift
      - path: DeepGroove/Contracts/Record/AddRecordSource.swift
      - path: DeepGroove/Contracts/Record/SearchRecordRequest.swift
      - path: DeepGroove/Contracts/Record/SearchRecordResponse.swift
      - path: DeepGroove/Contracts/AIVision/IdentifyRecordRequest.swift
      - path: DeepGroove/Contracts/AIVision/IdentifyRecordResponse.swift
      - path: DeepGroove/Contracts/AIVision/CorrectArtistNameRequest.swift
      - path: DeepGroove/Contracts/AIVision/CorrectArtistNameResponse.swift
      - path: DeepGroove/Contracts/Discogs/SearchDiscogsRequest.swift
      - path: DeepGroove/Contracts/Discogs/SearchDiscogsResponse.swift
      - path: DeepGroove/Contracts/Discogs/SearchDiscogsByBarcodeRequest.swift
      - path: DeepGroove/Contracts/Discogs/LoadDiscogsReleaseRequest.swift
      - path: DeepGroove/Contracts/Discogs/LoadDiscogsReleaseResponse.swift
      - path: DeepGroove/Contracts/Discogs/LoadDiscogsMasterRequest.swift
      - path: DeepGroove/Contracts/Discogs/LoadDiscogsMasterResponse.swift
      - path: DeepGroove/Contracts/Identification/ParseIdentificationRequest.swift
      - path: DeepGroove/Contracts/Identification/ParseIdentificationResponse.swift
      - path: DeepGroove/Accessors/Interfaces/IDiscogsAccessor.swift
      - path: DeepGroove/Accessors/Interfaces/IAIVisionAccessor.swift
      - path: DeepGroove/Accessors/Discogs/DiscogsAccessor.swift
      - path: DeepGroove/Accessors/Discogs/Handlers/SearchDiscogsHandler.swift
      - path: DeepGroove/Accessors/Discogs/Handlers/SearchDiscogsByBarcodeHandler.swift
      - path: DeepGroove/Accessors/Discogs/Handlers/LoadDiscogsReleaseHandler.swift
      - path: DeepGroove/Accessors/Discogs/Handlers/LoadDiscogsMasterHandler.swift
      - path: DeepGroove/Accessors/Discogs/Handlers/DiscogsSearchAPITypes.swift
      - path: DeepGroove/Accessors/Discogs/DiscogsAPI.swift
      - path: DeepGroove/Accessors/Discogs/DiscogsAPIError.swift
      - path: DeepGroove/Accessors/AIVision/AIVisionAccessor.swift
      - path: DeepGroove/Accessors/AIVision/AnthropicAPIError.swift
      - path: DeepGroove/Accessors/AIVision/Handlers/CorrectArtistNameHandler.swift
      - path: DeepGroove/Accessors/AIVision/Handlers/IdentifyRecordHandler.swift
      - path: DeepGroove/Engines/Interfaces/IIdentificationEngine.swift
      - path: DeepGroove/Engines/Identification/IdentificationEngine.swift
      - path: DeepGroove/Engines/Identification/Handlers/ParseIdentificationHandler.swift
      - path: DeepGroove/Managers/Record/Handlers/SearchRecordHandler.swift
      - path: DeepGroove/Managers/Record/SearchRecordHandlerFactory.swift
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: targeted
        INFOPLIST_FILE: DeepGrooveShareExtension/Info.plist
        PRODUCT_NAME: DeepGrooveShareExtension
        DEVELOPMENT_TEAM: 9C5WLPGP58
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks @executable_path/../Frameworks"
        CODE_SIGN_ENTITLEMENTS: DeepGrooveShareExtension/DeepGrooveShareExtension.entitlements
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jdonner.deepgroove.debug.shareextension
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.jdonner.deepgroove.shareextension

  DeepGrooveTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepGrooveTests
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: targeted
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: 9C5WLPGP58
    dependencies:
      - target: DeepGroove

  DeepGrooveWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepGrooveWidget
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        SWIFT_VERSION: "5.10"
        SWIFT_STRICT_CONCURRENCY: targeted
        INFOPLIST_FILE: DeepGrooveWidget/Info.plist
        PRODUCT_NAME: DeepGrooveWidget
        DEVELOPMENT_TEAM: 9C5WLPGP58
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../../Frameworks @executable_path/../Frameworks"
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jdonner.deepgroove.debug.widget
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.jdonner.deepgroove.widget
    dependencies:
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework

  DeepGroove:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DeepGroove
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_FILE: DeepGroove/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_NAME: DeepGroove
        DEVELOPMENT_TEAM: 9C5WLPGP58
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.jdonner.deepgroove.debug
          APP_DISPLAY_NAME: "Deep Groove Dev"
          CODE_SIGN_ENTITLEMENTS: DeepGroove/DeepGroove.Debug.entitlements
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.jdonner.deepgroove
          APP_DISPLAY_NAME: "Deep Groove"
          CODE_SIGN_ENTITLEMENTS: DeepGroove/DeepGroove.entitlements
    dependencies:
      - sdk: StoreKit.framework
      - target: DeepGrooveWidget
        embed: true
        codeSign: true
      - target: DeepGrooveShareExtension
        embed: true
        codeSign: true

schemes:
  DeepGroove:
    build:
      targets:
        DeepGroove: all
        DeepGrooveWidget: all
        DeepGrooveShareExtension: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - DeepGrooveTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
